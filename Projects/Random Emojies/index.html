<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta http-equiv="X-UA-Compatible" content="IE=edge" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Random Emoji Generator</title>
		<link rel="stylesheet" href="style.css" />
	</head>
	<body>
		<div class="container">
			<h1>Emoji Generator</h1>

			<div class="emoji-display">
				<div id="emoji" role="img" aria-label="random emoji" tabindex="0">
					😂
				</div>
				<p id="emoji-name" class="emoji-name"></p>
			</div>

			<div class="button-group">
				<button id="generate-btn" class="btn btn-primary">
					Generate Emoji
				</button>
				<button id="copy-btn" class="btn btn-secondary">Copy Emoji</button>
			</div>

			<div class="category-filter">
				<label for="category-select">Filter by Category:</label>
				<select id="category-select">
					<option value="all">All Emojis</option>
					<option value="happy">Happy</option>
					<option value="cool">Cool</option>
					<option value="sad">Sad</option>
					<option value="love">Love</option>
					<option value="animals">Animals</option>
					<option value="food">Food</option>
					<option value="celebration">Celebration</option>
				</select>
			</div>

			<div class="info">
				<p>Emojis generated: <span id="count">0</span></p>
				<p class="hint">
					💡 Tip: Press SPACE or ENTER to generate, or click the emoji
				</p>
				<p id="copy-feedback" class="copy-feedback"></p>
			</div>
		</div>

		<script src="app.js"></script>
	</body>
</html>
