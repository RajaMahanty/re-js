<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>ClassList Example</title>
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}

			body {
				font-family:
					-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu,
					Cantarell, sans-serif;
				background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
				min-height: 100vh;
				display: flex;
				align-items: center;
				justify-content: center;
				padding: 20px;
			}

			.container {
				background: white;
				border-radius: 12px;
				padding: 40px;
				box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
				max-width: 400px;
				width: 100%;
				text-align: center;
			}

			#myElement {
				font-size: 24px;
				color: #333;
				margin-bottom: 30px;
				padding: 20px;
				border-radius: 8px;
				transition: all 0.3s ease;
			}

			#myElement.highlight {
				background-color: #ffd700;
				color: #000;
				font-weight: bold;
				box-shadow: 0 4px 12px rgba(255, 215, 0, 0.4);
			}

			#toggleClass {
				background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
				color: white;
				border: none;
				padding: 12px 32px;
				font-size: 16px;
				border-radius: 8px;
				cursor: pointer;
				transition:
					transform 0.2s,
					box-shadow 0.2s;
				font-weight: 600;
			}

			#toggleClass:hover {
				transform: translateY(-2px);
				box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
			}

			#toggleClass:active {
				transform: translateY(0);
			}
		</style>
	</head>
	<body>
		<div class="container">
			<h1>ClassList Demo</h1>
			<div id="myElement">Hello, World!</div>
			<button id="toggleClass">Toggle Highlight</button>
		</div>

		<script src="./app.js"></script>
	</body>
</html>
